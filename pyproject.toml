[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "watcherr"
version = "1.0.0"
description = "Automated stalled torrent auto-healing and indexer failover watchdog for Sonarr, Radarr, and qBittorrent"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "Yatin Rajesh", email = "yatinrajesh77@gmail.com" }
]
keywords = ["sonarr", "radarr", "qbittorrent", "torrent", "prowlarr", "watchdog", "automation"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: File Sharing",
]

[project.scripts]
watcherr = "watcherr:main"

[tool.setuptools]
py-modules = ["watcherr"]
